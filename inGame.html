<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia Race - 遊戲中</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gameScreen" class="screen active">
    <div class="game-container">
        <!-- 進度條 -->
        <div class="progress-bar">
            <span class="progress-label">連眼條</span>
            <div class="progress-fill-wrapper">
                <div class="progress-fill"></div>
            </div>
            <span class="progress-percent">0%</span>
        </div>

        <!-- 遊戲主區 -->
        <div class="game-main">
            <!-- 左：遊戲區域 -->
            <div class="game-area">
                <div class="game-info">
                    <div class="info-box">
                        <span class="info-label">目標頁面</span>
                        <span class="info-value" id="targetTitle">-</span>
                    </div>
                    <div class="divider"></div>
                    <div class="info-box">
                        <span class="info-label">目前頁面</span>
                        <span class="info-value" id="currentTitle">-</span>
                    </div>
                </div>

                <div class="links-section">
                    <h3>可點擊連結</h3>
                    <ul id="linkList" class="links-list"></ul>
                </div>
            </div>

            <!-- 右：側欄 -->
            <div class="sidebar">
                <!-- 提示框 -->
                <div class="hint-circle">
                    <div class="hint-content">
                        <span class="hint-icon">💡</span>
                        <p>提示</p>
                        <small>盡量用最少步數達成目標</small>
                    </div>
                </div>

                <!-- 路徑 -->
                <div class="path-box">
                    <h4>路徑</h4>
                    <ul id="pathList" class="path-list"></ul>
                </div>

                <!-- 統計 -->
                <div class="stats-box">
                    <div class="stat-item">
                        <span class="stat-label">步數</span>
                        <span class="stat-value" id="stepCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">時間</span>
                        <span class="stat-value" id="timer">0<small>秒</small></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // inGame.html 初始化 - 從 sessionStorage 讀取題目
    document.addEventListener("DOMContentLoaded", function() {
        const startTitleFromSession = sessionStorage.getItem("startTitle");
        const targetTitleFromSession = sessionStorage.getItem("targetTitle");

        if (startTitleFromSession && targetTitleFromSession) {
            // 從 sessionStorage 恢復遊戲狀態
            startTitle = startTitleFromSession;
            targetTitle = targetTitleFromSession;
            currentTitle = startTitle;
            pathHistory = [startTitle];

            document.getElementById("targetTitle").innerText = targetTitle;
            document.getElementById("currentTitle").innerText = currentTitle;

            // 淡入效果
            const gameArea = document.querySelector(".game-area");
            gameArea.style.opacity = "0";
            gameArea.style.transition = "opacity 0.6s ease";
            
            setTimeout(() => {
                gameArea.style.opacity = "1";
            }, 50);

            startTimer();
            renderLinks(currentTitle);
            renderPath();
        } else {
            // 沒有題目資訊，返回主頁
            alert("遊戲資訊遺失，請重新開始");
            window.location.href = "index.html";
        }
    });
</script>
</body>
</html>
