<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wikipedia Race - 遊戲中</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gameScreen" class="screen active">
    <div class="game-container">
        <!-- 進度條 -->
        <div class="progress-bar">
            <span class="progress-label">連眼條</span>
            <div class="progress-fill-wrapper">
                <div class="progress-fill"></div>
            </div>
            <span class="progress-percent">0%</span>
        </div>

        <!-- 遊戲主區 -->
        <div class="game-main">
            <!-- 左：遊戲區域 -->
            <div class="game-area">
                <div class="links-section">
                    <h3>Wikipedia 頁面</h3>
                    <div class="wiki-frame-container">
                        <iframe id="wikiFrame" src="" style="border: none; border-radius: 8px;"></iframe>
                    </div>
                </div>
            </div>

            <!-- 右：側欄 -->
            <div class="sidebar">
                <!-- 遊戲資訊 -->
                <div class="game-info-box">
                    <div class="info-item">
                        <span class="info-label">目標</span>
                        <span class="info-value" id="targetTitle">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">目前</span>
                        <span class="info-value" id="currentTitle">-</span>
                    </div>
                </div>

                <!-- 返回按鈕 -->
                <button id="backBtn" class="back-btn" onclick="goBackPage()" style="display: none;">
                    ← 返回上一頁
                </button>

                <!-- 提示框 -->
                <div class="hint-circle">
                    <div class="hint-content">
                        <span class="hint-icon">💡</span>
                        <p>提示</p>
                        <small>盡量用最少步數達成目標</small>
                    </div>
                </div>

                <!-- 路徑 -->
                <div class="path-box">
                    <h4>路徑</h4>
                    <ul id="pathList" class="path-list"></ul>
                </div>

                <!-- 統計 -->
                <div class="stats-box">
                    <div class="stat-item">
                        <span class="stat-label">步數</span>
                        <span class="stat-value" id="stepCount">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">時間</span>
                        <span class="stat-value" id="timer">0<small>秒</small></span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="app.js"></script>
<script>
    // 允許的連結對應（3 步測試遊戲）
    const allowedLinks = {
        "台灣": ["日本", "中國", "東南亞"],
        "日本": ["東京", "亞洲", "台灣"],
        "東京": ["日本", "關東", "富士山"],
        // 其他頁面的連結會被擋掉
    };

    // inGame.html 初始化
    document.addEventListener("DOMContentLoaded", function() {
        const startTitleFromSession = sessionStorage.getItem("startTitle");
        const targetTitleFromSession = sessionStorage.getItem("targetTitle");

        if (startTitleFromSession && targetTitleFromSession) {
            // 從 sessionStorage 恢復遊戲狀態
            startTitle = startTitleFromSession;
            targetTitle = targetTitleFromSession;
            currentTitle = startTitle;
            pathHistory = [startTitle];

            document.getElementById("targetTitle").innerText = targetTitle;
            document.getElementById("currentTitle").innerText = currentTitle;

            // 淡入效果
            const gameArea = document.querySelector(".game-area");
            gameArea.style.opacity = "0";
            gameArea.style.transition = "opacity 0.6s ease";
            
            setTimeout(() => {
                gameArea.style.opacity = "1";
            }, 50);

            startTimer();
            loadWikiPage(currentTitle);
            renderPath();

        } else {
            // 沒有題目資訊，返回主頁
            alert("遊戲資訊遺失，請重新開始");
            window.location.href = "index.html";
        }
    });

    // 載入 Wiki 頁面到 iframe
    function loadWikiPage(pageTitle) {
        const wikiFrame = document.getElementById("wikiFrame");
        const wikiUrl = `https://zh.wikipedia.org/wiki/${encodeURIComponent(pageTitle)}`;
        wikiFrame.src = wikiUrl;

        // 監聽 iframe 內的連結點擊
        setTimeout(() => {
            try {
                const iframeDoc = wikiFrame.contentDocument || wikiFrame.contentWindow.document;
                if (iframeDoc) {
                    const links = iframeDoc.querySelectorAll("a");
                    links.forEach(link => {
                        link.addEventListener("click", (e) => {
                            handleWikiLinkClick(e, link);
                        });
                    });
                }
            } catch (error) {
                console.log("無法存取 iframe 內容（跨域限制）:", error);
            }
        }, 2000); // 等待 iframe 載入
    }

    // 處理 Wiki 連結點擊
    function handleWikiLinkClick(e, link) {
        e.preventDefault();
        
        // 提取頁面名稱
        const href = link.getAttribute("href");
        if (!href || !href.includes("/wiki/")) return;
        
        const nextPageTitle = decodeURIComponent(href.split("/wiki/")[1]);
        
        // 檢查是否允許
        if (isLinkAllowed(currentTitle, nextPageTitle)) {
            goToWikiPage(nextPageTitle);
        } else {
            alert(`「${nextPageTitle}」超出遊戲允許範圍`);
        }
    }

    // 檢查連結是否允許
    function isLinkAllowed(currentPage, nextPage) {
        const allowedForCurrentPage = allowedLinks[currentPage] || [];
        return allowedForCurrentPage.includes(nextPage);
    }

    // 跳轉到新的 Wiki 頁面
    function goToWikiPage(pageTitle) {
        currentTitle = pageTitle;
        stepCount++;

        document.getElementById("currentTitle").innerText = currentTitle;
        document.getElementById("stepCount").innerText = stepCount;
        
        pathHistory.push(pageTitle);
        renderPath();
        updateProgress();

        // 顯示返回按鈕（除了第一頁）
        const backBtn = document.getElementById("backBtn");
        if (stepCount > 1) {
            backBtn.style.display = "block";
        }

        // 載入新頁面
        loadWikiPage(pageTitle);

        // 檢查是否到達目標
        if (currentTitle === targetTitle) {
            finishGame();
        }
    }

    // 返回上一個頁面
    function goBackPage() {
        if (pathHistory.length <= 1) {
            alert("已經在第一頁了");
            return;
        }

        // 移除當前頁面，回到前一個
        pathHistory.pop();
        currentTitle = pathHistory[pathHistory.length - 1];
        stepCount = pathHistory.length - 1;

        // 更新 UI
        document.getElementById("currentTitle").innerText = currentTitle;
        document.getElementById("stepCount").innerText = stepCount;
        renderPath();
        updateProgress();

        // 隱藏返回按鈕（回到第一頁）
        const backBtn = document.getElementById("backBtn");
        if (stepCount === 1) {
            backBtn.style.display = "none";
        }

        // 載入頁面
        loadWikiPage(currentTitle);
    }
</script>
</body>
</html>
